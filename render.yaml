services:
  - type: web
    name: bonago-fvg
    runtime: node
    plan: free
    region: singapore
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: bunx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BUN_VERSION
        value: "1.3.5"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DERIV_APP_ID
        value: "1089"
      - key: DERIV_CLIENT_ID
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: DERIV_ACCESS_TOKEN
        sync: false
      - key: DERIV_DEMO_ACCESS_TOKEN
        sync: false
